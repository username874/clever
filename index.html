<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        main {
            width: min(1000px, 95%);
            padding-top: 50px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        button {
            padding: 14px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #error {
            color: #ff5555;
            min-height: 20px;
        }

        .player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            margin-top: 15px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* -------------------------
           PRIVATE CHAT
        ------------------------- */

        #privateArea {
            display: none;
            margin-top: 40px;
            padding-bottom: 50px;
        }

        #loginBox {
            max-width: 450px;
            margin: 40px auto;
            background: #1c1c1c;
            padding: 25px;
            border-radius: 12px;
        }

        #loginBox h2 {
            margin-top: 0;
            text-align: center;
        }

        #passwordInput {
            width: 100%;
            margin-bottom: 10px;
        }

        #loginButton {
            width: 100%;
        }

        #loginError {
            color: #ff5555;
            min-height: 20px;
            text-align: center;
        }

        #chatBox {
            display: none;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .message {
            margin-bottom: 16px;
            overflow-wrap: anywhere;
        }

        .username {
            font-weight: bold;
        }

        .message-time {
            color: #777;
            font-size: 12px;
            margin-left: 6px;
        }

        .message-image {
            display: block;
            max-width: min(500px, 100%);
            max-height: 400px;
            margin-top: 8px;
            border-radius: 8px;
            object-fit: contain;
        }

        #chatInputArea {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #usernameInput {
            flex: 0 0 180px;
        }

        #messageInput {
            flex: 1;
        }

        #imageInput {
            flex: 0 0 auto;
            max-width: 220px;
            padding: 10px;
            background: #1c1c1c;
            color: white;
            border-radius: 8px;
        }

        #sendButton {
            flex: 0 0 auto;
        }

        #uploadStatus {
            color: #aaa;
            min-height: 20px;
            margin: 8px 0;
            font-size: 14px;
        }

        #chatError {
            color: #ff5555;
            min-height: 20px;
        }

        @media (max-width: 750px) {

            #chatInputArea {
                flex-wrap: wrap;
            }

            #usernameInput,
            #messageInput,
            #imageInput,
            #sendButton {
                flex: 1 1 100%;
                max-width: none;
            }

        }
    </style>
</head>

<body>

<main>

    <!-- NORMAL YOUTUBE PLAYER -->

    <h1>YouTube Player</h1>

    <div class="input-area">

        <input
            id="urlInput"
            type="text"
            placeholder="Paste a YouTube URL..."
            autocomplete="off"
        >

        <button id="playButton">
            Play
        </button>

    </div>

    <p id="error"></p>

    <div class="player-container">

        <iframe
            id="player"
            src=""
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>


    <!-- PRIVATE AREA -->

    <div id="privateArea">

        <!-- PASSWORD SCREEN -->

        <div id="loginBox">

            <h2>Private Chat</h2>

            <input
                id="passwordInput"
                type="password"
                placeholder="Enter password..."
                autocomplete="off"
            >

            <button id="loginButton">
                Enter
            </button>

            <p id="loginError"></p>

        </div>


        <!-- CHAT -->

        <div id="chatBox">

            <h2>Private Chat</h2>

            <div id="messages"></div>

            <div id="chatInputArea">

                <input
                    id="usernameInput"
                    type="text"
                    placeholder="Username"
                    maxlength="32"
                    autocomplete="off"
                >

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message..."
                    maxlength="500"
                    autocomplete="off"
                >

                <input
                    id="imageInput"
                    type="file"
                    accept="image/jpeg,image/png,image/gif,image/webp"
                >

                <button id="sendButton">
                    Send
                </button>

            </div>

            <div id="uploadStatus"></div>

            <p id="chatError"></p>

        </div>

    </div>

</main>


<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_FUNCTION_URL =
        "https://ydycfpjdurgnctazelmy.supabase.co/functions/v1/chat-auth";


    // ==========================================
    // YOUTUBE PLAYER
    // ==========================================

    const input =
        document.getElementById("urlInput");

    const button =
        document.getElementById("playButton");

    const player =
        document.getElementById("player");

    const error =
        document.getElementById("error");


    function getYouTubeID(url) {

        try {

            const parsed =
                new URL(url);

            if (
                parsed.hostname === "youtube.com" ||
                parsed.hostname === "www.youtube.com"
            ) {
                return parsed.searchParams.get("v");
            }

            if (parsed.hostname === "youtu.be") {
                return parsed.pathname.substring(1);
            }

            return null;

        } catch {

            return null;

        }
    }


    function playVideo() {

        error.textContent = "";

        const url =
            input.value.trim();

        const videoID =
            getYouTubeID(url);

        if (!videoID) {

            error.textContent =
                "Please enter a valid YouTube URL.";

            return;
        }

        player.src =
            `https://www.youtube.com/embed/${videoID}?autoplay=1`;
    }


    button.addEventListener(
        "click",
        playVideo
    );


    input.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                playVideo();
            }

        }
    );


    // ==========================================
    // PRIVATE CHAT ELEMENTS
    // ==========================================

    const privateArea =
        document.getElementById("privateArea");

    const loginBox =
        document.getElementById("loginBox");

    const chatBox =
        document.getElementById("chatBox");

    const passwordInput =
        document.getElementById("passwordInput");

    const loginButton =
        document.getElementById("loginButton");

    const loginError =
        document.getElementById("loginError");

    const messages =
        document.getElementById("messages");

    const usernameInput =
        document.getElementById("usernameInput");

    const messageInput =
        document.getElementById("messageInput");

    const imageInput =
        document.getElementById("imageInput");

    const sendButton =
        document.getElementById("sendButton");

    const uploadStatus =
        document.getElementById("uploadStatus");

    const chatError =
        document.getElementById("chatError");


    // Session token stays ONLY in memory.

    let sessionToken = null;


    // Keep track of messages already displayed.
    // This prevents the chat from being rebuilt
    // every time it refreshes.

    const displayedMessageIds =
        new Set();


    // ==========================================
    // CHECK SECRET URL
    // ==========================================

    const secretPath =
        decodeURIComponent(
            window.location.hash.substring(1)
        );


    if (secretPath.length > 0) {

        privateArea.style.display =
            "block";

        passwordInput.focus();

    }


    // ==========================================
    // LOGIN
    // ==========================================

    async function login() {

        loginError.textContent = "";

        const password =
            passwordInput.value;

        if (!password) {

            loginError.textContent =
                "Enter the password.";

            return;
        }

        loginButton.disabled =
            true;

        loginButton.textContent =
            "Checking...";


        try {

            const response =
                await fetch(
                    SUPABASE_FUNCTION_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            action: "login",
                            password: password,
                            secretPath: secretPath
                        })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.authenticated
            ) {

                loginError.textContent =
                    data.error ||
                    "Login failed.";

                console.log(
                    "Login response:",
                    data
                );

                return;
            }


            sessionToken =
                data.token;


            // Clear any old message tracking
            // from a previous session.

            displayedMessageIds.clear();

            messages.innerHTML = "";


            loginBox.style.display =
                "none";

            chatBox.style.display =
                "block";


            await loadMessages();


            usernameInput.focus();

        } catch (err) {

            console.error(err);

            loginError.textContent =
                "Could not connect to the chat.";

        } finally {

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Enter";

        }
    }


    loginButton.addEventListener(
        "click",
        login
    );


    passwordInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                login();
            }

        }
    );


    // ==========================================
    // LOAD MESSAGES
    // ==========================================

    async function loadMessages() {

        if (!sessionToken) {
            return;
        }

        chatError.textContent = "";


        try {

            const response =
                await fetch(
                    SUPABASE_FUNCTION_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${sessionToken}`
                        },

                        body: JSON.stringify({
                            action: "messages"
                        })
                    }
                );


            const data =
                await response.json();


            if (response.status === 401) {

                sessionExpired();

                return;
            }


            if (!response.ok) {

                chatError.textContent =
                    data.error ||
                    "Could not load messages.";

                return;
            }


            // Only add messages that haven't
            // already been displayed.

            let addedNewMessage = false;


            for (const message of data) {

                /*
                 * The backend currently needs to return
                 * the message ID for this to work correctly.
                 *
                 * If an older backend response doesn't
                 * contain an ID, use the created_at value
                 * as a fallback.
                 */

                const messageId =
                    message.id !== undefined &&
                    message.id !== null
                        ? String(message.id)
                        : `${message.created_at}-${message.username}-${message.message}-${message.image_url || ""}`;


                if (
                    displayedMessageIds.has(
                        messageId
                    )
                ) {
                    continue;
                }


                displayedMessageIds.add(
                    messageId
                );


                addMessage(
                    message
                );


                addedNewMessage = true;

            }


            // Only scroll when a genuinely new message
            // was added AND the user was already near
            // the bottom.

            if (addedNewMessage) {

                const distanceFromBottom =
                    messages.scrollHeight -
                    messages.scrollTop -
                    messages.clientHeight;


                if (distanceFromBottom < 100) {

                    messages.scrollTop =
                        messages.scrollHeight;

                }

            }

        } catch (err) {

            console.error(err);

            chatError.textContent =
                "Could not connect to the chat.";

        }
    }


    // ==========================================
    // DISPLAY MESSAGE
    // ==========================================

    function addMessage(message) {

        const div =
            document.createElement("div");

        div.className =
            "message";


        // Username

        const username =
            document.createElement("span");

        username.className =
            "username";

        username.textContent =
            message.username;


        // Text

        const text =
            document.createElement("span");


        if (message.message) {

            text.textContent =
                ": " + message.message;

        }


        // Time

        const time =
            document.createElement("span");

        time.className =
            "message-time";


        const date =
            new Date(
                message.created_at
            );


        time.textContent =
            date.toLocaleTimeString();


        div.appendChild(username);


        if (message.message) {

            div.appendChild(text);

        }


        div.appendChild(time);


        // Image

        if (message.image_url) {

            const image =
                document.createElement("img");

            image.className =
                "message-image";

            image.src =
                message.image_url;

            image.alt =
                "Chat image";

            image.loading =
                "lazy";


            div.appendChild(image);

        }


        messages.appendChild(div);

    }


    // ==========================================
    // UPLOAD IMAGE
    // ==========================================

    async function uploadImage(file) {

        if (!sessionToken) {

            throw new Error(
                "Not authenticated."
            );

        }


        const formData =
            new FormData();


        formData.append(
            "action",
            "upload"
        );


        formData.append(
            "file",
            file
        );


        const response =
            await fetch(
                SUPABASE_FUNCTION_URL,
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            `Bearer ${sessionToken}`
                    },

                    body: formData
                }
            );


        const data =
            await response.json();


        if (response.status === 401) {

            sessionExpired();

            throw new Error(
                "Session expired."
            );

        }


        if (
            !response.ok ||
            !data.uploaded
        ) {

            throw new Error(
                data.error ||
                "Could not upload image."
            );

        }


        return data.path;

    }


    // ==========================================
    // SEND MESSAGE
    // ==========================================

    async function sendMessage() {

        chatError.textContent = "";
        uploadStatus.textContent = "";


        if (!sessionToken) {
            return;
        }


        const username =
            usernameInput.value.trim();

        const message =
            messageInput.value.trim();

        const file =
            imageInput.files[0] || null;


        if (!username) {

            chatError.textContent =
                "Enter a username.";

            return;
        }


        if (
            !message &&
            !file
        ) {

            chatError.textContent =
                "Enter a message or choose an image.";

            return;
        }


        sendButton.disabled =
            true;


        try {

            let imagePath =
                null;


            // Upload image first.

            if (file) {

                uploadStatus.textContent =
                    "Uploading image...";


                imagePath =
                    await uploadImage(file);


                uploadStatus.textContent =
                    "Image uploaded.";

            }


            // Send message and image path.

            const response =
                await fetch(
                    SUPABASE_FUNCTION_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${sessionToken}`
                        },

                        body: JSON.stringify({
                            action: "send",
                            username: username,
                            message: message,
                            imagePath: imagePath
                        })
                    }
                );


            const data =
                await response.json();


            if (response.status === 401) {

                sessionExpired();

                return;
            }


            if (
                !response.ok ||
                !data.sent
            ) {

                chatError.textContent =
                    data.error ||
                    "Could not send message.";

                return;
            }


            // Clear inputs.

            messageInput.value = "";
            imageInput.value = "";
            uploadStatus.textContent = "";


            // Refresh chat.

            await loadMessages();


            messageInput.focus();

        } catch (err) {

            console.error(err);

            chatError.textContent =
                err.message ||
                "Could not send message.";

        } finally {

            sendButton.disabled =
                false;

        }
    }


    sendButton.addEventListener(
        "click",
        sendMessage
    );


    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        }
    );


    // ==========================================
    // SESSION EXPIRED
    // ==========================================

    function sessionExpired() {

        sessionToken =
            null;

        displayedMessageIds.clear();

        messages.innerHTML = "";

        chatBox.style.display =
            "none";

        loginBox.style.display =
            "block";

        passwordInput.value = "";

        loginError.textContent =
            "Your session expired. Enter the password again.";

        passwordInput.focus();

    }


    // ==========================================
    // REFRESH MESSAGES
    // ==========================================

    setInterval(
        function() {

            if (sessionToken) {

                loadMessages();

            }

        },
        5000
    );

</script>

</body>
</html>
